name: Deploy MERN Backend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Server Syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m

          script: |
            set -e

            APP_DIR="/var/www/backend"
            REPO="https://github.com/Ratu0713/mern-backend-gh.git"

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            date
            echo "========================================="

            command -v git
            command -v node
            command -v npm
            command -v pm2
            command -v curl

            cd "$APP_DIR"

            echo "Checking Git repository..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found in $APP_DIR"
              exit 1
            fi

            echo "Checking Git remote..."

            git remote set-url origin "$REPO"

            git remote -v

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env file is missing!"
              exit 1
            fi

            echo "Updating repository..."

            git fetch origin main
            git reset --hard origin/main

            git clean -fd -e .env -e logs/

            mkdir -p "$APP_DIR/logs"

            echo "Checking required files..."

            test -f package.json
            test -f package-lock.json
            test -f src/server.js
            test -f ecosystem.config.js
            test -f .env

            echo "Installing production dependencies..."

            npm ci --omit=dev

            echo "Restarting backend..."

            if pm2 describe backend-api >/dev/null 2>&1; then
              pm2 delete backend-api
            fi

            pm2 start ecosystem.config.js --env production

            pm2 save

            echo "Waiting for backend..."

            sleep 5

            pm2 status

            echo "Running health check..."

            HEALTH_URL="http://127.0.0.1:5000/api/health"
            HEALTH_OK=0

            for i in $(seq 1 12); do

              HTTP_CODE=$(curl -sS \
                -o /tmp/backend-health.json \
                -w "%{http_code}" \
                --max-time 5 \
                "$HEALTH_URL" || true)

              echo "Health check attempt $i: HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                cat /tmp/backend-health.json
                HEALTH_OK=1
                break
              fi

              sleep 5
            done

            if [ "$HEALTH_OK" -ne 1 ]; then

              echo "ERROR: Health check failed"

              echo "----- PM2 STATUS -----"
              pm2 status || true

              echo "----- PM2 DESCRIPTION -----"
              pm2 describe backend-api || true

              echo "----- PM2 LOGS -----"
              pm2 logs backend-api --lines 100 --nostream || true

              echo "----- LISTENING PORTS -----"
              sudo ss -lntp || true

              echo "----- LOG DIRECTORY -----"
              ls -la "$APP_DIR/logs" || true

              exit 1
            fi

            echo "========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            date
            echo "========================================="